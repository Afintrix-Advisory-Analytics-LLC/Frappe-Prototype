<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Afintrix starter</title>
  <link rel="stylesheet" href="afintrix-ui.css">
  <script src="afintrix-ui.js" defer></script>
</head>
<body class="ax" style="margin:0;padding:32px;background:var(--ax-canvas)">
  <div class="ax-stack" style="max-width:720px">
    <div><span class="ax-kicker">Afintrix UI</span><h1>It works.</h1><p class="ax-lead">One stylesheet, one script. Copy any component's HTML from the component library into this page.</p></div>
    <div class="ax-card"><div class="ax-card-head"><h3>Purchase order PUR-ORD-2026-00042</h3><span class="ax-stamp is-info">To receive &amp; bill</span></div>
      <div class="ax-card-body ax-stack">
        <div class="ax-field"><label class="ax-label" for="s-sup">Supplier<span class="ax-req">*</span></label>
          <div class="ax-combo" data-ax="combobox" data-options='[{"value":"Meridian Supplies Ltd","hint":"Raw Material"},{"value":"Nordic Components AB","hint":"Hardware"}]'><input class="ax-input" id="s-sup" placeholder="Search suppliers"></div></div>
        <div class="ax-btn-row"><button class="ax-btn" type="button" data-ax="toast" data-title="Saved" data-text="PUR-ORD-2026-00042" data-tone="ok"><svg class="ax-i is-sm" aria-hidden="true"><use href="#ax-i-check"></use></svg>Save</button><button class="ax-btn is-secondary" type="button">Cancel</button></div>
      </div>
    </div>
  </div>
</body>
</html>
